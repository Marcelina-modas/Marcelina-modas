<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcelina Modas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bordo: #C23B6C;
    --bordo-2: #E06B93;
    --rosa: #F6C9D8;
    --creme: #FFF3F6;
    --dourado: #D88AA8;
    --texto: #2A1E1B;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--creme);
    color: var(--texto);
    font-family: 'Jost', sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    min-height: 100%;
    overflow-x: hidden;
  }
  .page {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    padding: 0 28px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Faixa decorativa animada no topo */
  .faixa {
    width: 100%;
    height: 210px;
    position: relative;
    overflow: hidden;
    margin: 0 -28px;
    width: calc(100% + 56px);
    background: linear-gradient(160deg, var(--bordo) 0%, var(--bordo-2) 55%, var(--dourado) 130%);
  }
  .faixa::before, .faixa::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    opacity: 0.5;
  }
  .faixa::before {
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 70%);
    top: -90px; left: -60px;
    animation: flutuar 9s ease-in-out infinite;
  }
  .faixa::after {
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
    bottom: -100px; right: -50px;
    animation: flutuar 11s ease-in-out infinite reverse;
  }
  @keyframes flutuar {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(14px,-10px) scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .faixa::before, .faixa::after { animation: none; }
  }

  .emblema {
    position: relative;
    margin-top: -78px;
    width: 148px;
    height: 148px;
    border-radius: 50%;
    background: var(--creme);
    border: 3px solid var(--dourado);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 10px 26px rgba(194,59,108,0.25);
    opacity: 0;
    transform: translateY(14px) scale(0.94);
    animation: surgir 0.8s cubic-bezier(.22,1,.36,1) 0.15s forwards;
  }
  .emblema span {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.7rem;
    line-height: 1.05;
    letter-spacing: 0.02em;
    color: var(--bordo);
  }
  @keyframes surgir {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 2.6rem;
    margin: 20px 0 4px;
    text-align: center;
    color: var(--bordo);
    opacity: 0;
    animation: subir 0.7s ease-out 0.4s forwards;
  }
  .subtitulo {
    text-align: center;
    font-size: 0.98rem;
    color: #6b524c;
    max-width: 30ch;
    line-height: 1.55;
    margin: 0 0 30px;
    opacity: 0;
    animation: subir 0.7s ease-out 0.55s forwards;
  }
  @keyframes subir {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .linha-ornamento {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 300px;
    margin-bottom: 26px;
    opacity: 0;
    animation: subir 0.7s ease-out 0.65s forwards;
  }
  .linha-ornamento::before, .linha-ornamento::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rosa);
  }
  .linha-ornamento span {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--dourado);
    white-space: nowrap;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .botao {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-decoration: none;
    color: var(--creme);
    background: linear-gradient(135deg, var(--bordo), var(--bordo-2));
    padding: 16px 20px;
    border-radius: 999px;
    font-size: 1.02rem;
    font-weight: 500;
    box-shadow: 0 6px 16px rgba(194,59,108,0.22);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    opacity: 0;
    animation: subir 0.6s ease-out forwards;
  }
  .botao:nth-of-type(1) { animation-delay: 0.75s; }
  .botao:nth-of-type(2) { animation-delay: 0.85s; }
  .botao:hover, .botao:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(194,59,108,0.3);
  }
  .botao:focus-visible { outline: 2px solid var(--dourado); outline-offset: 3px; }
  .botao .icone {
    width: 22px; height: 22px;
    flex-shrink: 0;
  }
  .botao.secundario {
    background: transparent;
    color: var(--bordo);
    border: 1.5px solid var(--rosa);
    box-shadow: none;
  }
  .botao.secundario:hover { background: rgba(246,201,216,0.35); }

  .horario {
    margin-top: 30px;
    width: 100%;
    text-align: center;
    font-size: 0.85rem;
    color: #8a736c;
    opacity: 0;
    animation: subir 0.7s ease-out 0.95s forwards;
  }
  .horario strong { color: var(--bordo); font-weight: 500; }

  footer {
    margin-top: auto;
    padding-top: 40px;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: #b39a92;
    text-align: center;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --creme: #1C1412;
      --texto: #F3E8E3;
    }
  }
  :root[data-theme="dark"] {
    --creme: #1C1412;
    --texto: #F3E8E3;
  }
</style>
</head>

</div>
</body>
</html>
